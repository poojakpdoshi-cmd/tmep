name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          # The minimal ffmpeg formula omits libass. ffmpeg-full is keg-only.
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Chocolatey occasionally fails or leaves no shim; retry, verify, then fall back to the
          # GitHub-hosted build. A missing FFmpeg must fail here, never as skipped tests later.
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            choco install ffmpeg -y --no-progress
            $ok = (Get-Command ffmpeg -ErrorAction SilentlyContinue) -and (Get-Command ffprobe -ErrorAction SilentlyContinue)
            if (-not $ok) { Write-Host "choco attempt $i did not provide ffmpeg/ffprobe"; Start-Sleep -Seconds (10 * $i) }
          }
          if (-not $ok) {
            $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
            Invoke-WebRequest -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip' -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 10
            Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'ffmpeg')
            $bin = (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'ffmpeg') -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
            Add-Content $env:GITHUB_PATH $bin
            $env:PATH = "$bin;$env:PATH"
          }
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1

      - name: Install dev dependencies (typescript, @types/node)
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: FFmpeg preflight (ffmpeg, ffprobe, libass, encoders)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { ffmpegInfo, requireFilters } from './packages/media/src/ffmpeg.ts';
          const info = await ffmpegInfo(); // Also verifies ffprobe is available.
          console.log('FFmpeg', info.version, 'via', info.ffmpeg);
          requireFilters(info, ['subtitles', 'ass']);
          for (const encoder of ['libx264', 'aac', 'mpeg4']) {
            if (!info.encoders.has(encoder)) throw new Error('FFmpeg lacks required encoder: ' + encoder);
          }
          console.log('E2E capabilities verified: libass subtitles/ass, libx264, aac, mpeg4, ffprobe');
          NODE

      - name: Preflight through the product (tmep doctor --require)
        run: node bin/tmep.js doctor --require

      - name: Unit + protocol tests
        run: npm test

      - name: Doctor
        run: node bin/tmep.js doctor

      - name: End-to-end render tests
        run: npm run test:e2e

      - name: Readiness smoke test (Windows)
        if: runner.os == 'Windows' && matrix.node == '24.x'
        run: node examples/readiness/smoke.mjs
