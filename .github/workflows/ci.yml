name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          # The minimal ffmpeg formula omits libass. ffmpeg-full is keg-only.
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install dev dependencies (typescript, @types/node)
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Unit + protocol tests
        run: npm test

      - name: Doctor
        run: node bin/tmep.js doctor

      - name: Verify FFmpeg E2E capabilities
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { ffmpegInfo, requireFilters } from './packages/media/src/ffmpeg.ts';
          const info = await ffmpegInfo(); // Also verifies ffprobe is available.
          console.log('FFmpeg', info.version, 'via', info.ffmpeg);
          requireFilters(info, ['subtitles', 'ass']);
          for (const encoder of ['libx264', 'aac', 'mpeg4']) {
            if (!info.encoders.has(encoder)) throw new Error('FFmpeg lacks required encoder: ' + encoder);
          }
          console.log('E2E capabilities verified: libass subtitles/ass, libx264, aac, mpeg4, ffprobe');
          NODE

      - name: End-to-end render tests
        run: npm run test:e2e
